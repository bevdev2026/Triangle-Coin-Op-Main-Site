<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Triangle Coin Op">
  <defs>
    <radialGradient id="bg" cx="42%" cy="36%" r="82%">
      <stop offset="0"    stop-color="#3A1A0E"/>
      <stop offset="0.55" stop-color="#2A1209"/>
      <stop offset="1"    stop-color="#0B0401"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D48040"/>
      <stop offset="1" stop-color="#8B3E1A"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- partial small gear, upper right -->
  <g fill="#8B3E1A" opacity="0.6">
    <rect x="489" y="22" width="22" height="40" rx="6" transform="rotate(0 500 120)"/>
    <rect x="489" y="22" width="22" height="40" rx="6" transform="rotate(36 500 120)"/>
    <rect x="489" y="22" width="22" height="40" rx="6" transform="rotate(72 500 120)"/>
    <rect x="489" y="22" width="22" height="40" rx="6" transform="rotate(108 500 120)"/>
    <rect x="489" y="22" width="22" height="40" rx="6" transform="rotate(144 500 120)"/>
    <rect x="489" y="22" width="22" height="40" rx="6" transform="rotate(180 500 120)"/>
    <rect x="489" y="22" width="22" height="40" rx="6" transform="rotate(216 500 120)"/>
    <rect x="489" y="22" width="22" height="40" rx="6" transform="rotate(252 500 120)"/>
    <rect x="489" y="22" width="22" height="40" rx="6" transform="rotate(288 500 120)"/>
    <rect x="489" y="22" width="22" height="40" rx="6" transform="rotate(324 500 120)"/>
    <circle cx="500" cy="120" r="70"/>
  </g>
  <circle cx="500" cy="120" r="22" fill="url(#bg)"/>

  <!-- main gear -->
  <g fill="url(#brass)" opacity="0.94">
    <rect x="282" y="96" width="36" height="62" rx="9" transform="rotate(0 300 300)"/>
    <rect x="282" y="96" width="36" height="62" rx="9" transform="rotate(30 300 300)"/>
    <rect x="282" y="96" width="36" height="62" rx="9" transform="rotate(60 300 300)"/>
    <rect x="282" y="96" width="36" height="62" rx="9" transform="rotate(90 300 300)"/>
    <rect x="282" y="96" width="36" height="62" rx="9" transform="rotate(120 300 300)"/>
    <rect x="282" y="96" width="36" height="62" rx="9" transform="rotate(150 300 300)"/>
    <rect x="282" y="96" width="36" height="62" rx="9" transform="rotate(180 300 300)"/>
    <rect x="282" y="96" width="36" height="62" rx="9" transform="rotate(210 300 300)"/>
    <rect x="282" y="96" width="36" height="62" rx="9" transform="rotate(240 300 300)"/>
    <rect x="282" y="96" width="36" height="62" rx="9" transform="rotate(270 300 300)"/>
    <rect x="282" y="96" width="36" height="62" rx="9" transform="rotate(300 300 300)"/>
    <rect x="282" y="96" width="36" height="62" rx="9" transform="rotate(330 300 300)"/>
    <circle cx="300" cy="300" r="152"/>
  </g>
  <circle cx="300" cy="300" r="100" fill="none" stroke="#D48040" stroke-width="6" opacity="0.5"/>
  <circle cx="300" cy="300" r="60"  fill="url(#bg)"/>
  <circle cx="300" cy="300" r="60"  fill="none" stroke="#D48040" stroke-width="4" opacity="0.65"/>

  <!-- bolt heads -->
  <g fill="#D48040" opacity="0.7">
    <circle cx="300" cy="176" r="9" transform="rotate(0 300 300)"/>
    <circle cx="300" cy="176" r="9" transform="rotate(60 300 300)"/>
    <circle cx="300" cy="176" r="9" transform="rotate(120 300 300)"/>
    <circle cx="300" cy="176" r="9" transform="rotate(180 300 300)"/>
    <circle cx="300" cy="176" r="9" transform="rotate(240 300 300)"/>
    <circle cx="300" cy="176" r="9" transform="rotate(300 300 300)"/>
  </g>
  <circle cx="300" cy="300" r="13" fill="#D48040" opacity="0.8"/>

  <text x="300" y="556" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="22" letter-spacing="6" fill="#DFC090" opacity="0.55">TRIANGLE COIN OP</text>
</svg>
